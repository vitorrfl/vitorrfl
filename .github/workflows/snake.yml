name: Gera a animacao da cobrinha

# Le o grafico de contribuicao do perfil, gera os SVGs da cobrinha
# e publica na branch "output". O README aponta para os arquivos
# dessa branch, entao nada aqui depende de servico de terceiro.

on:
  schedule:
    # todo dia as 03:00 UTC (meia-noite em Brasilia)
    - cron: "0 3 * * *"
  # permite rodar na mao pelo botao "Run workflow"
  workflow_dispatch:
  # regera sempre que o README mudar
  push:
    branches:
      - main

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Gera os SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Cores escritas na mao para casar com a paleta gruvbox
          # usada nos cards de estatistica do README.
          # color_dots vai do quadradinho vazio ao de maior atividade.
          outputs: |
            dist/snake.svg?color_snake=%23fe8019&color_dots=%23ebdbb2,%23d5c4a1,%23bdae93,%23fabd2f,%23fe8019
            dist/snake-dark.svg?color_snake=%23fe8019&color_dots=%23282828,%23504945,%23bdae93,%23fabd2f,%23fe8019

      # Mesmo cuidado do workflow do grafico de atividade: a action troca a
      # branch "output" inteira pelo conteudo de dist/, entao e preciso trazer
      # de volta o que o outro workflow publicou la.
      - name: Preserva o grafico de atividade
        run: |
          git fetch origin output --depth 1 || exit 0
          for f in $(git ls-tree --name-only origin/output); do
            [ -e "dist/$f" ] || git show "origin/output:$f" > "dist/$f"
          done
          ls -la dist/

      - name: Publica na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
